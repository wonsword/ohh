<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>스팸봇 차단</title>
<link rel="stylesheet" href="../../assets/styles.css">
</head>
<body class="page-wrap">
<div class="page-header">
  <div class="breadcrumb"><a data-go="dashboard">홈</a> <span class="sep">›</span> <a data-go="sites">사이트 관리</a> <span class="sep">›</span> <a data-go="sites/edit">형사그룹</a> <span class="sep">›</span> 스팸봇 차단</div>
  <div class="page-title">
    <h1>🛡 스팸봇 차단 정책</h1>
    <span class="sub">사이트별 화이트리스트 관리</span>
    <div class="actions"><button class="btn primary">💾 저장</button></div>
  </div>
</div>
<div class="page-body">

  <div class="callout">
    🔐 전역 정책은 <code>SUPER</code>만 수정 가능 · 이 페이지에서는 사이트별 화이트리스트를 관리합니다.
  </div>

  <div class="grid-2">
    <div class="card">
      <div class="card-head"><h3>차단 정책</h3></div>
      <div class="card-body">
        <div class="form-grid">
          <label>UA 패턴 차단<span class="hint">정규식 가능</span></label>
          <textarea class="textarea" style="font-family:monospace">curl|python-requests|wget|scrapy|bot</textarea>
          <label>IP 블랙리스트</label><textarea class="textarea" style="font-family:monospace">203.0.113.0/24
198.51.100.42</textarea>
          <label>요청 빈도 제한</label>
          <div class="form-row-3">
            <div class="input-with-suffix"><input value="60"/><span class="suffix">/min</span></div>
            <div class="input-with-suffix"><input value="500"/><span class="suffix">/h</span></div>
            <div class="input-with-suffix"><input value="10000"/><span class="suffix">/d</span></div>
          </div>
          <label>reCAPTCHA</label>
          <div><div class="toggle on"></div><span class="help">상담폼·후기 작성 시 v3 검증</span></div>
          <label>허니팟 필드</label>
          <div><div class="toggle on"></div><span class="help">숨김 필드 입력 시 즉시 차단</span></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h3>최근 차단 로그</h3>
        <div class="actions"><button class="btn sm">📥 CSV</button></div>
      </div>
      <div class="card-body tight">
        <table class="data">
          <thead><tr><th>시각</th><th>IP</th><th>UA</th><th>이유</th></tr></thead>
          <tbody>
            <tr><td class="text-muted">15:42</td><td>203.0.113.55</td><td>curl/8.5</td><td><span class="badge danger">UA 차단</span></td></tr>
            <tr><td class="text-muted">15:37</td><td>198.51.100.42</td><td>—</td><td><span class="badge danger">IP 블랙</span></td></tr>
            <tr><td class="text-muted">15:21</td><td>203.0.113.99</td><td>scrapy/2</td><td><span class="badge pending">빈도</span></td></tr>
            <tr><td class="text-muted">14:58</td><td>—</td><td>Mozilla/5.0</td><td><span class="badge pending">허니팟</span></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<script src="../../assets/page.js"></script>
